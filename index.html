<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DeliveryApp</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Inter',sans-serif;
  background:#2563eb;
  min-height:100vh;
  padding:20px;
}

.container{
  max-width:500px;
  margin:0 auto;
}

.card{
  background:#fff;
  border-radius:24px;
  padding:24px;
  margin-top:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.logo{
  text-align:center;
  color:#fff;
  margin-top:50px;
}

.logo h1{
  font-size:38px;
  font-weight:800;
}

.logo p{
  opacity:.8;
  margin-top:8px;
}

input,select,textarea{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:2px solid #dbeafe;
  margin-top:8px;
  margin-bottom:16px;
  font-size:15px;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-weight:700;
  cursor:pointer;
  font-size:15px;
}

button:hover{
  opacity:.95;
}

.title{
  font-size:22px;
  font-weight:800;
  margin-bottom:20px;
  color:#1e293b;
}

.item{
  background:#eff6ff;
  padding:14px;
  border-radius:14px;
  margin-bottom:12px;
}

.item h3{
  color:#1e293b;
  margin-bottom:6px;
}

.badge{
  display:inline-block;
  background:#16a34a;
  color:#fff;
  padding:4px 10px;
  border-radius:999px;
  font-size:12px;
  margin-top:8px;
}

.logout{
  background:#dc2626;
  margin-top:10px;
}

.hidden{
  display:none;
}

.info{
  font-size:13px;
  color:#64748b;
  margin-bottom:20px;
}
</style>
</head>
<body>

<div class="container">

  <div class="logo">
    <h1>DeliveryApp</h1>
    <p>Gestão de Entregas</p>
  </div>

  <div class="card" id="loginCard">
    <div class="title">Entrar no sistema</div>

    <select id="user">
      <option value="">Selecione o usuário</option>
      <option value="admin">Admin</option>
    </select>

    <input type="password" id="password" placeholder="Senha"/>

    <button onclick="login()">Entrar</button>

    <p class="info">
      Usuário: admin<br>
      Senha: admin123
    </p>
  </div>

  <div class="card hidden" id="dashboard">
    <div class="title">Painel de Entregas</div>

    <input type="text" id="cliente" placeholder="Nome do cliente"/>
    <input type="text" id="telefone" placeholder="Telefone"/>
    <input type="text" id="endereco" placeholder="Endereço"/>
    <textarea id="obs" placeholder="Observações"></textarea>

    <button onclick="salvarEntrega()">Salvar Entrega</button>

    <button class="logout" onclick="logout()">Sair</button>

    <div style="margin-top:20px">
      <div class="title" style="font-size:18px">Entregas</div>
      <div id="lista"></div>
    </div>
  </div>

</div>

<script>

const ADMIN = {
  user:'admin',
  password:'admin123'
};

function login(){

  const user = document.getElementById('user').value;
  const password = document.getElementById('password').value;

  if(user === ADMIN.user && password === ADMIN.password){

    localStorage.setItem('logado','true');

    document.getElementById('loginCard').classList.add('hidden');
    document.getElementById('dashboard').classList.remove('hidden');

    carregarEntregas();

  }else{
    alert('Usuário ou senha inválidos');
  }
}

function logout(){

  localStorage.removeItem('logado');

  location.reload();
}

function salvarEntrega(){

  const cliente = document.getElementById('cliente').value;
  const telefone = document.getElementById('telefone').value;
  const endereco = document.getElementById('endereco').value;
  const obs = document.getElementById('obs').value;

  if(!cliente || !telefone || !endereco){
    alert('Preencha os campos obrigatórios');
    return;
  }

  const entregas = JSON.parse(localStorage.getItem('entregas') || '[]');

  entregas.unshift({
    cliente,
    telefone,
    endereco,
    obs,
    status:'Pendente'
  });

  localStorage.setItem('entregas', JSON.stringify(entregas));

  document.getElementById('cliente').value = '';
  document.getElementById('telefone').value = '';
  document.getElementById('endereco').value = '';
  document.getElementById('obs').value = '';

  carregarEntregas();

  alert('Entrega cadastrada com sucesso!');
}

function carregarEntregas(){

  const lista = document.getElementById('lista');

  const entregas = JSON.parse(localStorage.getItem('entregas') || '[]');

  lista.innerHTML = '';

  if(entregas.length === 0){
    lista.innerHTML = '<p>Nenhuma entrega cadastrada.</p>';
    return;
  }

  entregas.forEach((e,index)=>{

    lista.innerHTML += `
      <div class="item">
        <h3>${e.cliente}</h3>

        <p><strong>Telefone:</strong> ${e.telefone}</p>
        <p><strong>Endereço:</strong> ${e.endereco}</p>
        <p><strong>Obs:</strong> ${e.obs || '-'}</p>

        <span class="badge">${e.status}</span>
      </div>
    `;
  });
}

window.onload = () => {

  const logado = localStorage.getItem('logado');

  if(logado === 'true'){

    document.getElementById('loginCard').classList.add('hidden');
    document.getElementById('dashboard').classList.remove('hidden');

    carregarEntregas();
  }
};

</script>

</body>
</html>
